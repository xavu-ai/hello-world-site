version: '3.8'

services:
  static-hosting:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"
    environment:
      - NGINX_PORT=${NGINX_PORT:-8080}
      - STATIC_ROOT=${STATIC_ROOT:-/usr/share/nginx/html}
    volumes:
      - ./public:/usr/share/nginx/html:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${NGINX_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
