version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-world-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STATIC_DIR=public
      - INDEX_FILE=index.html
    ports:
      - "3000:3000"
    volumes:
      # Mount for development - comment out for production
      - ./public:/app/public:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
