version: '3.8'

services:
  static-server:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - ALLOWED_HOSTS=["example.com","www.example.com"]
    volumes:
      - ./backend/static:/app/static:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
